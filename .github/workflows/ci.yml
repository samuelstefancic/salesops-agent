name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - run: uv run evaluate
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: reports/
