[project]
name = "udacenture-salesops"
version = "1.0.0"
description = "A local SalesOps agent with policy enforcement and run evidence"
requires-python = ">=3.13,<3.14"
dependencies = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "python-dotenv>=1.1,<2"]

[project.scripts]
salesops-agent = "salesops.cli:main"
evaluate = "salesops.evaluation:main"
generate-monitoring-report = "salesops.reporting:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesops"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
